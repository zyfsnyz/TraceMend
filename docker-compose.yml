services:
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment:
      DEFAULT_UPSTREAM_BASE: ${DEFAULT_UPSTREAM_BASE:-https://api.openai.com/v1}
      DEFAULT_MCP_UPSTREAM: ${DEFAULT_MCP_UPSTREAM:-}
      DB_URL: sqlite:////data/agenttrace.db
      ENABLE_LLM_CHECK: ${ENABLE_LLM_CHECK:-false}
      CHECK_MODEL_BASE: ${CHECK_MODEL_BASE:-https://api.openai.com/v1}
      CHECK_MODEL_KEY: ${CHECK_MODEL_KEY:-}
      CHECK_MODEL_NAME: ${CHECK_MODEL_NAME:-gpt-4o-mini}
      ADMIN_KEY: ${ADMIN_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 4s
      retries: 6
    restart: unless-stopped
