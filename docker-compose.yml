services:
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment:
      AGENTTRACE_ENV_FILE: /data/.env
      AGENTTRACE_BOOTSTRAP_ENV: /run/agenttrace/bootstrap.env
      DB_URL: sqlite:////data/agenttrace.db
      ADMIN_KEY: ${ADMIN_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
      - ./.env:/run/agenttrace/bootstrap.env:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 4s
      retries: 6
    restart: unless-stopped
